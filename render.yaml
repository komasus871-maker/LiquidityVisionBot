services:
  - type: web
    name: liquidityvisionbot-1
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: BOT_MODE
        value: webhook
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REQUIRE_PERSISTENT_DB
        value: "true"
      - key: PGSSLMODE
        value: require
      - key: MONITOR_CRON_SECRET
        sync: false
      - key: WEBHOOK_BASE_URL
        value: https://liquidityvisionbot-1.onrender.com
      - key: SIGNAL_CHECK_INTERVAL
        value: "60"
      - key: OBSERVATION_CHECK_INTERVAL
        value: "300"
      - key: WATCHLIST_CHECK_INTERVAL
        value: "300"
      - key: ANALYSIS_CONCURRENCY
        value: "2"
      - key: SCANNER_CONCURRENCY
        value: "4"
      - key: SCANNER_CACHE_TTL
        value: "30"
      - key: WEBHOOK_MAX_ACTIVE_UPDATES
        value: "100"
      - key: AI_TRADING_MODE
        value: AI_SHADOW
      - key: AI_PROVIDER
        value: disabled
      - key: AI_PROVIDER_PROTOCOL
        value: chat_completions
      - key: AI_STRUCTURED_OUTPUT_MODE
        value: auto
      - key: AI_STRICT_SCHEMA_REQUIRED
        value: "false"
      - key: AI_ALLOW_JSON_OBJECT_FALLBACK
        value: "true"
      - key: AI_SCHEMA_VERSION
        value: ai-decision-v1
      - key: AI_MODEL
        sync: false
      - key: AI_MODEL_VERSION
        sync: false
      - key: AI_PROVIDER_ENDPOINT
        sync: false
      - key: AI_PROVIDER_API_KEY
        sync: false
      - key: AI_REQUEST_TIMEOUT_SECONDS
        value: "8"
      - key: AI_PROVIDER_MAX_ATTEMPTS
        value: "2"
      - key: AI_MAX_DAILY_REQUESTS_PER_USER
        value: "25"
      - key: AI_MAX_DAILY_REQUESTS
        value: "500"
      - key: AI_MAX_DAILY_COST_USD
        value: "5"
      - key: AI_MAX_TOKENS
        value: "800"
      - key: AI_MAX_CONCURRENCY
        value: "2"
      - key: AI_CONTEXT_MAX_AGE_SECONDS
        value: "300"
      - key: AI_CONTEXT_MAX_CHARS
        value: "30000"
      - key: AI_PRICE_VERSION
        sync: false
      - key: AI_INPUT_COST_PER_MILLION_USD
        sync: false
      - key: AI_OUTPUT_COST_PER_MILLION_USD
        sync: false
      - key: AI_CACHED_INPUT_COST_PER_MILLION_USD
        sync: false
      - key: AI_REQUIRE_PRICING_FOR_REQUESTS
        value: "true"
      - key: AI_SUPPORTS_JSON_OBJECT
        value: "true"
      - key: AI_SUPPORTS_JSON_SCHEMA
        value: "true"
      - key: AI_SUPPORTS_STRICT_SCHEMA
        value: "true"
      - key: AI_SUPPORTS_TEMPERATURE
        value: "true"
      - key: AI_SUPPORTS_MAX_TOKENS
        value: "true"
      - key: AI_SUPPORTS_MAX_COMPLETION_TOKENS
        value: "false"
      - key: PREMIUM_STARS
        value: "199"
      - key: PREMIUM_DAYS
        value: "30"
