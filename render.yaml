services:
  - type: web
    name: liquidityvisionbot-1
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_VERSION
        value: 9.9.18
      - key: BOT_MODE
        value: webhook
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REQUIRE_PERSISTENT_DB
        value: "true"
      - key: PGSSLMODE
        value: require
      - key: MONITOR_CRON_SECRET
        sync: false
      - key: WEBHOOK_BASE_URL
        value: https://liquidityvisionbot-1.onrender.com
      - key: SIGNAL_CHECK_INTERVAL
        value: "60"
      - key: OBSERVATION_CHECK_INTERVAL
        value: "300"
      - key: WATCHLIST_CHECK_INTERVAL
        value: "300"
      - key: ANALYSIS_CONCURRENCY
        value: "2"
      - key: SCANNER_CONCURRENCY
        value: "4"
      - key: SCANNER_CACHE_TTL
        value: "30"
      - key: WEBHOOK_MAX_ACTIVE_UPDATES
        value: "100"
      - key: COPY_EXECUTION_ENABLED
        value: "true"
      - key: COPY_EXECUTION_INTERVAL
        value: "60"
      - key: COPY_EXECUTION_LEASE_SECONDS
        value: "180"
      - key: PAPER_MIN_NOTIONAL_USDT
        value: "5"
      - key: PAPER_QUANTITY_DECIMALS
        value: "8"
      - key: RESEARCH_INTERVAL_SECONDS
        value: "300"
      - key: RESEARCH_BATCH_LIMIT
        value: "200"
      - key: RESEARCH_MIN_SAMPLES
        value: "20"
      - key: EDGE_MIN_SAMPLES
        value: "20"
      - key: EDGE_MODERATE_SAMPLES
        value: "50"
      - key: EDGE_HIGH_SAMPLES
        value: "100"
      - key: EDGE_BOOTSTRAP_SAMPLES
        value: "500"
      - key: EDGE_BOOTSTRAP_MAX_N
        value: "500"
      - key: EDGE_COMBINATION_MIN_SAMPLES
        value: "20"
      - key: EDGE_COMBINATION_MIN_SUPPORT
        value: "0.05"
      - key: EDGE_MAX_COMBINATIONS
        value: "120"
      - key: EDGE_MAX_NEW_HYPOTHESES
